name = "notchone"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "notchone.one", custom_domain = true },
  { pattern = "www.notchone.one", custom_domain = true },
]

[assets]
directory = "website"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "COUNTS"
id = "7da7740185b845fdb58ba09ba981e7ea"

[[d1_databases]]
binding = "DB"
database_name = "notchone-stats"
database_id = "24735c46-59ca-4c38-96d2-cddf1db4bd40"
