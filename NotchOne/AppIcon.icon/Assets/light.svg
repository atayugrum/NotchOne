<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Warm light behind the glass: a yellow glow top left, a deep orange one bottom right. -->
  <defs>
    <radialGradient id="warm" cx="246" cy="315" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE07A" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE07A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="847" cy="847" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8430F" stop-opacity="0.7"/><stop offset="1" stop-color="#D8430F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#warm)"/>
  <rect width="1024" height="1024" fill="url(#deep)"/>
</svg>
